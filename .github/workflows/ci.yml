name: source-only-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install source and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Current theorem unit tests
        run: python -m pytest -q tests/test_current_certificate.py tests/test_family_contract.py tests/test_recertify_holm_output.py tests/test_conservative_solver_contract.py tests/test_brief_s0.py tests/test_mixture.py tests/test_officehome_selector_rescue.py tests/test_campaign_finalize.py
      - name: Versioned v18 theorem and artifact gate
        run: make reproduce-v18
      - name: Deterministic source-only gate
        env:
          FEDCORE_ALLOW_MISSING_ARTIFACTS: "1"
        run: python tests/golden_check.py
      - name: Withdrawn Lemma experiment stays fail-closed
        run: |
          if python -m fedcore.experiments.exp_lemma_L; then
            echo "retired experiment unexpectedly succeeded"
            exit 1
          fi
