[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedcore"
version = "0.2.0"
description = "Fed-CORE: Federated Certified Open-Set Recognition (certification core)"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
]

[project.optional-dependencies]
test = [
    "pytest>=8,<10",
    "pandas>=2,<4",
    "pyarrow>=15,<25",
    "scikit-learn>=1.3,<2",
    "PyYAML>=6,<7",
]
plots = [
    "matplotlib>=3.8,<4",
    "pandas>=2,<4",
]
train = [
    "torch>=2.3,<3",
    "torchvision>=0.18,<1",
]
medical = [
    "medmnist>=3,<4",
    "pandas>=2,<4",
    "Pillow>=10,<13",
]

# The importable package is the hoisted project-root fedcore/ directory (with all
# subpackages: certificate, data, models, experiments, aggregate, plotting).
# experiments/ holds paper artifacts only and is NOT part of the installed package.
[tool.setuptools.packages.find]
where = ["."]
include = ["fedcore*"]
namespaces = false
