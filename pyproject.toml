[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedcore"
version = "0.1.0"
description = "Fed-CORE: Federated Certified Open-Set Recognition (certification core)"
requires-python = ">=3.10"
# Runtime dependencies are pinned in requirements.lock. PyTorch and torchvision
# are supplied by the GPU container used by the experiment launchers.

# The importable package is the project-root fedcore/ directory.
[tool.setuptools.packages.find]
where = ["."]
include = ["fedcore*"]
namespaces = false
